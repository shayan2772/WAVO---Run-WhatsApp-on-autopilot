name: CI

# Lightweight CI: lint + type-check + build for the backend and the dashboard.
# (The heavy multi-arch Docker, Postgres, SDK, and release workflows were removed for this fork.)
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '22'

jobs:
  backend:
    name: Backend (lint · type-check · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npx tsc -p tsconfig.build.json --noEmit
      - name: Build
        run: npm run build

  dashboard:
    name: Dashboard (lint · type-check · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json
      - name: Install dependencies
        run: cd dashboard && npm ci
      - name: Lint
        run: cd dashboard && npm run lint
      - name: Type-check & build
        run: cd dashboard && npm run build
